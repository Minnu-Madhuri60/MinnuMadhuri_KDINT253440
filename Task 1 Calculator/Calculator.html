<!DOCTYPE html>
<html>
<head>
    <title>Advanced Web Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }

        .calculator {
            background: white;
            padding: 20px;
            width: 320px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 15px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px;
            margin: 5px;
            width: 60px;
            font-size: 16px;
            cursor: pointer;
        }

        .wide-btn {
            width: 90%;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="calculator">
    <h2>Simple Calculator</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <br>

    <!-- Operation Buttons -->
    <button onclick="setOperation('+')">+</button>
    <button onclick="setOperation('-')">-</button>
    <button onclick="setOperation('*')">*</button>
    <button onclick="setOperation('/')">/</button>

    <br>

    <button onclick="calculateEqual()">=</button>

    <br>

    <button class="wide-btn" onclick="calculateAll()">All Operations</button>

    <div id="result"></div>
</div>

<script>

let selectedOperation = "";

function setOperation(op) {
    selectedOperation = op;
    document.getElementById("result").innerHTML = "Selected Operation: " + op;
}

function calculateEqual() {
    let a = parseFloat(document.getElementById("num1").value);
    let b = parseFloat(document.getElementById("num2").value);

    if (isNaN(a) || isNaN(b) || selectedOperation === "") {
        document.getElementById("result").innerHTML = "Enter numbers & select operation";
        return;
    }

    let result;

    if (selectedOperation === "+") result = a + b;
    else if (selectedOperation === "-") result = a - b;
    else if (selectedOperation === "*") result = a * b;
    else if (selectedOperation === "/") {
        result = b !== 0 ? a / b : "Cannot divide by zero";
    }

    document.getElementById("result").innerHTML = "Result: " + result;
}

function calculateAll() {
    let a = parseFloat(document.getElementById("num1").value);
    let b = parseFloat(document.getElementById("num2").value);

    if (isNaN(a) || isNaN(b)) {
        document.getElementById("result").innerHTML = "Please enter valid numbers";
        return;
    }

    let division = b !== 0 ? a / b : "Cannot divide by zero";

    document.getElementById("result").innerHTML =
        "Addition: " + (a + b) + "<br>" +
        "Subtraction: " + (a - b) + "<br>" +
        "Multiplication: " + (a * b) + "<br>" +
        "Division: " + division;
}

</script>

</body>
</html>
